spring.application.name=fandoom-backend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fandoom?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Cloudinary'e yuklemeden once sunucu tarafi WebP donusumu (media/service/ThumbnailatorImageCompressor)
media.image.max-width=${MEDIA_IMAGE_MAX_WIDTH:2000}
media.image.max-height=${MEDIA_IMAGE_MAX_HEIGHT:2000}
media.image.quality=${MEDIA_IMAGE_QUALITY:0.82}

# JWT — secret'in fallback'i YOK (DB_PASSWORD ile aynı konvansiyon): eksikse acilista patlamali
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Ilk ADMIN bootstrap - ucu de setliyse VE hic ADMIN yoksa bir kere calisir
admin.bootstrap.username=${ADMIN_BOOTSTRAP_USERNAME:}
admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}
admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}

# E-posta dogrulama
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.email.verification-expiration-ms=${EMAIL_VERIFICATION_EXPIRATION_MS:86400000}
app.email.verification-link-base=${EMAIL_VERIFICATION_LINK_BASE:http://localhost:8080/api/auth/verify-email}
