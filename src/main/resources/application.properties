spring.application.name=fandoom-backend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fandoom?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
# Sema Flyway ile yonetilir (db/migration); Hibernate yalnizca dogrular.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Lazy koleksiyon/proxy'ler (ör. Season.seasonBlocks, Episode.episodeBlocks, Series.genreIds)
# entity başına ayrı SELECT (N+1) yerine 50'şerli IN (...) gruplarıyla toplu yüklenir. JOIN FETCH ile
# çekilemeyen ikinci/üçüncü bag koleksiyonları için (MultipleBagFetchException) güvenli çözüm.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Jackson 3.x, record deserializasyonunda JSON'da hic gonderilmeyen bir alani
# primitive tipe (ör. "boolean spoilerFlagged") null olarak baglamaya calisip
# unboxing'de patliyor (MismatchedInputException -> 500). Optional/varsayilanli
# primitive alanlari olan TUM request record'lari (ThreadRequest.spoilerFlagged,
# CommentRequest.spoilerFlagged, vb.) bunu etkiliyor. Bu tek ayar, alan alan
# Boolean wrapper'a cevirmek yerine sorunu global olarak cozer.
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Cloudinary'e yuklemeden once sunucu tarafi WebP donusumu (media/service/ThumbnailatorImageCompressor)
media.image.max-width=${MEDIA_IMAGE_MAX_WIDTH:2000}
media.image.max-height=${MEDIA_IMAGE_MAX_HEIGHT:2000}
media.image.quality=${MEDIA_IMAGE_QUALITY:0.82}

# JWT — secret'in fallback'i YOK (DB_PASSWORD ile aynı konvansiyon): eksikse acilista patlamali
# Redis (Spring Cache — bkz. common/config/RedisConfig). Kisa timeout: Redis kesintisinde istekler
# uzun sure asili kalmasin, CacheErrorConfig hatayi loglayip DB'ye duser.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

# Kafka (yerel Docker: docker-compose.yml -> fandoom-kafka)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
# Broker mesajı tüm replikalara yazdığını onaylamadan "gönderildi" sayılmasın.
spring.kafka.producer.acks=all
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
# Yalnızca kendi mesaj paketimizden sınıf oluşturulsun (güvenilmeyen tip adıyla nesne üretmeyi engeller).
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.fandoom_backend.account.event,com.example.fandoom_backend.notification.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.fandoom_backend.account.event.ProfileFollowMessage
# Yeni bir consumer grubu topic'teki eski mesajları da baştan okusun (grubun kayıtlı offset'i yoksa).
spring.kafka.consumer.auto-offset-reset=earliest

jwt.secret=${JWT_SECRET}
# Access token: 15 dakika (kısa ömürlü, çalınırsa etki alanı sınırlı). Yenilemesi POST /api/auth/refresh.
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
# Refresh token: 7 gün, HttpOnly cookie'de taşınır (bkz. RefreshTokenCookieFactory). JWT DEĞİL, DB'de
# saklanan rastgele bir metin (RefreshTokenServiceImpl) — bu yüzden jwt.secret'a bağımlı değil.
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
# Prod'da true (HTTPS zorunlu) kalmalı; yalnızca HTTPS olmayan yerel geliştirmede false yapın.
jwt.refresh-cookie-secure=${JWT_REFRESH_COOKIE_SECURE:true}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Ilk ADMIN bootstrap - ucu de setliyse VE hic ADMIN yoksa bir kere calisir
admin.bootstrap.username=${ADMIN_BOOTSTRAP_USERNAME:}
admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}
admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}

# E-posta dogrulama
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.email.verification-expiration-ms=${EMAIL_VERIFICATION_EXPIRATION_MS:86400000}
app.email.verification-link-base=${EMAIL_VERIFICATION_LINK_BASE:http://localhost:8080/api/auth/verify-email}

# Birlesik arama: quick search'te tum kaynaklar icin ortak bekleme tavani (bekleme suresi DEGIL; normalde ~20-45 ms'de
# donulur). Asan kaynak bos doner, cevap cache'lenmez. Cok kisa tutmak "olum sarmali" riski: normal gunde bile eksik
# cevap -> cache yazilmaz -> DB yuku artar. Kural: normal en yavas surenin birkac kati (bkz. tasarim belgesi Karar 8).
search.quick.timeout=300ms
